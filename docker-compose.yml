# Starts the RaceDay website in a container with ONE command:
#     docker compose up --build
#
# The website calls the RaceDay API, which runs on your own computer (see README-Part3.md).
# host.docker.internal is the name a container uses to reach the computer it runs on.
services:
  web:
    build:
      context: ./RaceDay.Web
    image: raceday-web
    container_name: raceday-web
    ports:
      - "8080:8080"
    environment:
      ApiBaseUrl: "http://host.docker.internal:5100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
